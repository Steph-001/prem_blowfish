<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- newspaper -->
  <g transform="translate(150 90)">
    <rect x="0" y="0" width="300" height="220" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <!-- masthead -->
    <rect x="20" y="20" width="260" height="34" fill="#1e3a8a"/>
    <text x="150" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#f8fafc" letter-spacing="2">NEWS</text>
    <!-- columns -->
    <rect x="20"  y="70"  width="125" height="8" fill="#94a3b8"/>
    <rect x="20"  y="86"  width="125" height="6" fill="#cbd5e1"/>
    <rect x="20"  y="98"  width="125" height="6" fill="#cbd5e1"/>
    <rect x="20"  y="110" width="100" height="6" fill="#cbd5e1"/>
    <rect x="20"  y="128" width="125" height="6" fill="#cbd5e1"/>
    <rect x="20"  y="140" width="115" height="6" fill="#cbd5e1"/>
    <rect x="20"  y="152" width="125" height="6" fill="#cbd5e1"/>
    <rect x="20"  y="164" width="90"  height="6" fill="#cbd5e1"/>

    <rect x="155" y="70"  width="125" height="60" fill="#cbd5e1"/>
    <rect x="155" y="140" width="125" height="6"  fill="#94a3b8"/>
    <rect x="155" y="152" width="125" height="6"  fill="#cbd5e1"/>
    <rect x="155" y="164" width="125" height="6"  fill="#cbd5e1"/>
    <rect x="155" y="176" width="100" height="6"  fill="#cbd5e1"/>

    <line x1="20" y1="190" x2="280" y2="190" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="20" y="200" width="260" height="6" fill="#cbd5e1"/>
  </g>
</svg>
