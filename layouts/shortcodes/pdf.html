{{/* layouts/shortcodes/pdf.html */}}
{{/*
  Affiche un PDF :

  1. Si des images converties `<base>-page-*.jpg` existent à côté du PDF
     dans le dossier de la page, on affiche ces images empilées
     (rendu propre, sans toolbar de viewer navigateur).
  2. Sinon, on retombe sur l'embed natif `<object>` historique.

  Dans les deux cas, un bouton « ⬇ Download PDF » est rendu sous le bloc
  pour permettre aux élèves de télécharger le document original.

  Conversion des PDF (à lancer une fois sur le Mac, après ajout d'un PDF) :
      brew install poppler
      cd content/chapters/<chapitre>/
      for pdf in *.pdf; do
        pdftoppm -jpeg -r 150 "$pdf" "${pdf%.pdf}-page"
      done

  Paramètres :
    src (requis)        : chemin vers le PDF
    max_width (opt)     : largeur max ("100%", "800px", etc.). Défaut "100%".
    align (opt)         : "center" ou "left". Défaut "center".
                          ("right" est mappé vers "left" — voir note Docsy.)
    max_pages (opt)     : nombre de pages à afficher en mode rasterisé.
                          Défaut "0" = toutes. Ex: "1" affiche uniquement
                          la première page. Le bouton Download pointe
                          toujours vers le PDF complet.
    aspect_ratio (opt)  : utilisé uniquement par le fallback `<object>`.
                          Défaut A4 portrait (1.4143).

  Exemples :
    {{< pdf src="circe.pdf" >}}
    {{< pdf src="circe.pdf" max_width="80%" align="left" >}}
    {{< pdf src="long_doc.pdf" max_pages="1" >}}
*/}}

{{ $src        := .Get "src" }}
{{ $maxWidth   := .Get "max_width"    | default "100%" }}
{{ $align      := .Get "align"        | default "center" }}
{{ $maxPages   := int (.Get "max_pages" | default 0) }}
{{ $aspectRatio := .Get "aspect_ratio" | default "1.4143" }}

{{/* Normalise align (cf. fullscreen-image / pdf historique) */}}
{{ $align = lower $align }}
{{ if eq $align "right" }}{{ $align = "left" }}{{ end }}
{{ if not (in (slice "left" "center") $align) }}{{ $align = "center" }}{{ end }}
{{ $alignClass := printf "media-align-%s" $align }}

{{/* Résolution du PDF dans les ressources de la page */}}
{{ $file := .Page.Resources.GetMatch $src }}
{{ $pdfSrc := "" }}
{{ if $file }}
  {{ $pdfSrc = $file.RelPermalink }}
{{ else }}
  {{ $pdfSrc = $src | relURL }}
{{ end }}

{{/* Recherche des pages converties : <base>-page-*.jpg */}}
{{ $base := strings.TrimSuffix ".pdf" (path.Base $src) }}
{{/* Ex : "James" pour "James.pdf" */}}
{{ $pagePattern := printf "%s-page-*.jpg" $base }}
{{ $pages := .Page.Resources.Match $pagePattern }}
{{/* Cas-rare : .pdf en majuscules → tester aussi en lower */}}
{{ if not $pages }}
  {{ $altPattern := printf "%s-page-*.jpg" (lower $base) }}
  {{ $pages = .Page.Resources.Match $altPattern }}
{{ end }}

{{ if $pdfSrc }}
  <div class="pdf-embed-wrapper mb-4 {{ $alignClass }}" style="max-width: {{ $maxWidth }};">
    {{ if $pages }}
      {{/* === Mode "images empilées" === */}}
      {{/* Si max_pages > 0, on limite le nombre de pages affichées. */}}
      {{ $displayedPages := $pages }}
      {{ if gt $maxPages 0 }}
        {{ $displayedPages = first $maxPages $pages }}
      {{ end }}
      <div class="pdf-pages">
        {{ range $displayedPages }}
          <img src="{{ .RelPermalink }}"
               alt="Page {{ . }}"
               loading="lazy"
               decoding="async"
               class="pdf-page" />
        {{ end }}
      </div>
    {{ else }}
      {{/* === Fallback : embed `<object>` historique === */}}
      {{ $aspectRatioPercent := printf "%v%%" (mul (float $aspectRatio) 100.0) }}
      <div class="pdf-aspect-ratio-container"
           style="position: relative; height: 0; padding-bottom: {{ $aspectRatioPercent }}; overflow: hidden; border-radius: 0.375rem; border: 1px solid #ccc;">
        <object class="pdf-embed-object"
                data="{{ $pdfSrc }}"
                type="application/pdf"
                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;">
          <p style="padding: 1rem;">Your browser cannot display PDFs inline. Use the download button below.</p>
        </object>
      </div>
    {{ end }}

    {{/* === Bouton de téléchargement (toujours présent) === */}}
    <a href="{{ $pdfSrc }}"
       download
       class="pdf-download-link">
      Download PDF
    </a>
  </div>
{{ else }}
  <div class="alert alert-danger" role="alert">
    PDF Shortcode Error: Could not find PDF file with src "{{ $src }}"
  </div>
{{ end }}
