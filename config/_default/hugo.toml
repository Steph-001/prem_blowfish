# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://nunocoracao.github.io/blowfish/docs/getting-started/

theme = "blowfish"
baseURL = "https://premieres.stephanejacquet.fr/"
defaultContentLanguage = "en"

enableRobotsTXT = true
[pagination]
  pagerSize = 20
summaryLength = 30

buildDrafts = false
buildFuture = false

enableEmoji = true

# googleAnalytics = "G-XXXXXXXXX"

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

# -- Date précédence --
# Pour chaque page, Hugo cherche d'abord `taught` dans le front-matter.
# S'il est absent, il se replie sur `date` (date de création).
# Convention : mettre `taught: 2025-11-04` dans le front-matter d'un
# chapitre pour afficher la date de début d'étude avec les élèves
# plutôt que la date de création du fichier.
[frontmatter]
  date = ["taught", "date", "publishDate", "lastmod"]
